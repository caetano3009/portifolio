<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LevelUp Finance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-wrapper">
    <div class="brand-area text-center">
      <div class="logo-box">
        <div class="coin coin-1">$</div>
        <div class="coin coin-2">$</div>
      </div>
      <h1 class="brand-title">LEVELUP</h1>
      <span class="brand-subtitle">FINANCE</span>
    </div>

    <div class="login-card">
      <h2 class="card-title">COMECE SUA JORNADA</h2>
      <p id="loginError" style="color:#ff5100;text-align:center;display:none;margin-bottom:12px;">Email ou senha incorretos.</p>
      <form id="loginForm">
        <div class="mb-4">
          <label class="form-label custom-label">EMAIL</label>
          <input type="email" id="loginEmail" class="form-control custom-input" placeholder="hero@levelup.finance" />
        </div>
        <div class="mb-5">
          <label class="form-label custom-label">SENHA</label>
          <input type="password" id="loginPassword" class="form-control custom-input" placeholder="Coloque sua senha" />
        </div>
        <button type="submit" class="btn enter-btn w-100">ENTER THE ARENA</button>
        <a href="cadastro.html" class="register-link">É um novo aventureiro? Crie sua conta.</a>
      </form>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
