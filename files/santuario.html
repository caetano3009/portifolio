<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Santuário | LevelUp Finance</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="css/santuario.css"
  />

</head>

<body>

  <div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-logo">
        <h1>LEVELUP</h1>
        <span>FINANCE</span>
      </div>

      <nav class="sidebar-menu">

        <a
          href="dashboard.html"
          class="menu-item"
        >
          <i class="bi bi-house-door-fill"></i>
          Hub
        </a>

        <a
          href="arena.html"
          class="menu-item"
        >
          <i class="bi bi-sword"></i>
          Arena
        </a>

        <a
          href="santuario.html"
          class="menu-item active"
        >
          <i class="bi bi-stars"></i>
          Santuário
        </a>

        <a
          href="oraculo.html"
          class="menu-item"
        >
          <i class="bi bi-braces-asterisk"></i>
          Oráculo
        </a>

      </nav>
        <a href="index.html" class="logout-btn">
        <i class="bi bi-box-arrow-left"></i>
        Sair
        </a>      
    </aside>

    <!-- MAIN -->
    <main class="dashboard-content">

      <!-- HERO -->
      <section class="hero-section">

        <div class="hero-icon">
          <i class="bi bi-stars"></i>
        </div>

        <h1>O SANTUÁRIO</h1>

        <p>
          Fortaleça seus poços de mana
          e alcance seus objetivos
        </p>

      </section>

      <!-- TOTAL -->
      <section class="total-mana-card">

        <h2>
          MANA TOTAL COLETADA
        </h2>

        <div class="mana-values">

          <span>$10.600 / $37.000</span>

          <span>10600 / 37000</span>

        </div>

        <div class="total-progress">

          <div class="total-progress-fill"></div>

        </div>

        <div class="active-wells">

          <span>Poços Ativos:</span>

          <strong id="activeWells">
            4
          </strong>

        </div>

      </section>

      <!-- HEADER -->
      <div class="section-header">

        <h2 class="section-title">
          POÇOS DE MANA
        </h2>

        <button
          class="new-well-btn"
          id="openWellModal"
        >
          + NOVO POÇO
        </button>

      </div>

      <!-- GRID -->
      <section
        class="wells-grid"
        id="wellsGrid"
      >

      </section>

    </main>

  </div>

  <!-- MODAL ADD MANA -->
  <div
    class="mana-modal"
    id="manaModal"
  >

    <div class="mana-modal-box">

      <h2 id="modalTitle">
        ADICIONAR MANA
      </h2>

      <label>
        VALOR ($)
      </label>

      <input
        type="number"
        id="manaInput"
        value="100"
      />

      <div class="mana-info">

        <p id="modalCurrent">
          Atual: $0
        </p>

        <p id="modalRemaining">
          Restante: $0
        </p>

      </div>

      <div class="mana-actions">

        <button
          class="cancel-btn"
          id="closeModal"
        >
          CANCELAR
        </button>

        <button
          class="deposit-btn"
          id="depositBtn"
        >
          DEPOSITAR
        </button>

      </div>

    </div>

  </div>

  <!-- MODAL NOVO POÇO -->
  <div
    class="well-modal"
    id="wellModal"
  >

    <div class="well-modal-box">

      <h2>
        CRIAR NOVO POÇO DE MANA
      </h2>

      <label>
        NOME DA META
      </label>

      <input
        type="text"
        id="goalName"
        placeholder="Ex: Viagem para o Japão"
      />

      <label>
        VALOR DA META ($)
      </label>

      <input
        type="number"
        id="goalAmount"
        placeholder="5000"
      />

      <label>
        PRAZO
      </label>

      <input
        type="date"
        id="goalDate"
      />

      <div class="well-modal-actions">

        <button
          class="cancel-well-btn"
          id="closeWellModal"
        >
          CANCELAR
        </button>

        <button
          class="create-well-btn"
          id="createWellBtn"
        >
          CRIAR
        </button>

      </div>

    </div>

  </div>

  <!-- JS -->
  <script src="js/santuario.js"></script>

</body>
</html>
